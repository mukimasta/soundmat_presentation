<section class="slide zoom zwalk" id="slide-8" data-step="0"
  data-step-titles='["How loud is one press?","Neighbours bleed it down","Why a tiny resistor wins"]'
  data-step-subs='["Reading a column is just a voltage divider: the pressed stone on top, a fixed reference resistor below. We sized it so one stone reads about a third of full scale, while an empty cell sits near zero — easy to tell apart.","Stones sharing a column open extra paths to ground, so each neighbour drags the reading lower. The crucial part: crosstalk only ever pulls the voltage down, never up. It can hide a press, but it can never invent one.","A bigger resistor would shout louder — but bleed far more. We only need yes / no, not pressure, so we pick a small one (R_ref ≈ 200 Ω) and set the trigger low, at 10%. Every real press stays above it; every empty cell stays below. A miss is possible; a false note is not."]'>
  <div class="zoom-content zoom-walk-content">
    <div class="zoom-header">
      <div class="zoom-eyebrow">Sensor read-out</div>
      <h2 class="zoom-title" data-step-title>How loud is one press?</h2>
      <p class="zoom-caption" data-step-sub>Reading a column is just a voltage divider: the pressed stone on top, a fixed reference resistor below. We sized it so one stone reads about a third of full scale, while an empty cell sits near zero — easy to tell apart.</p>
    </div>

    <div class="zoom-stage-wrap">
      <svg class="readout-svg" viewBox="0 0 1280 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="barGreen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#46D06B"/><stop offset="100%" stop-color="#2BA84A"/>
          </linearGradient>
          <marker id="rDown" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,0 L5,10 z" fill="#E89318"/></marker>
        </defs>

        <!-- ============ ALWAYS-ON: divider schematic + axes ============ -->
        <g class="always">
          <!-- divider schematic -->
          <text x="170" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#86868B" letter-spacing="0.04em">THE READ CIRCUIT</text>
          <rect x="120" y="72" width="100" height="44" rx="10" fill="#E89318"/>
          <text x="170" y="101" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">5 V</text>
          <line x1="170" y1="116" x2="170" y2="150" stroke="#1D1D1F" stroke-width="3"/>
          <rect x="108" y="150" width="124" height="64" rx="10" fill="#FAF6EE" stroke="#1D1D1F" stroke-width="2"/>
          <text x="170" y="180" text-anchor="middle" font-size="18" font-weight="800" fill="#1D1D1F">stone</text>
          <text x="170" y="201" text-anchor="middle" font-size="13.5" font-weight="600" fill="#6E6E73">pressed</text>
          <line x1="170" y1="214" x2="170" y2="250" stroke="#1D1D1F" stroke-width="3"/>
          <circle cx="170" cy="250" r="8" fill="#2B6CB0"/>
          <text x="196" y="246" font-size="14.5" font-weight="700" fill="#2B6CB0">read</text>
          <line x1="170" y1="250" x2="170" y2="284" stroke="#1D1D1F" stroke-width="3"/>
          <rect x="108" y="284" width="124" height="64" rx="10" fill="#fff" stroke="#2B6CB0" stroke-width="2"/>
          <text x="170" y="314" text-anchor="middle" font-size="18" font-weight="800" fill="#2B6CB0">R_ref</text>
          <text x="170" y="335" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1D1D1F">200 Ω</text>
          <line x1="170" y1="348" x2="170" y2="380" stroke="#1D1D1F" stroke-width="3"/>
          <g stroke="#1D1D1F" stroke-width="3" stroke-linecap="round">
            <line x1="150" y1="380" x2="190" y2="380"/>
            <line x1="158" y1="389" x2="182" y2="389"/>
            <line x1="164" y1="397" x2="176" y2="397"/>
          </g>
          <text x="170" y="430" text-anchor="middle" font-size="14.5" font-weight="600" fill="#9b958a">node voltage =</text>
          <text x="170" y="450" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6E6E73">column reading →</text>

          <!-- chart axes -->
          <line x1="360" y1="110" x2="360" y2="505" stroke="#D2D2D7" stroke-width="2"/>
          <line x1="360" y1="505" x2="1230" y2="505" stroke="#C2BBAD" stroke-width="3" stroke-linecap="round"/>
          <text x="345" y="116" text-anchor="end" font-size="14" fill="#9b958a" font-weight="600">100%</text>
          <text x="345" y="510" text-anchor="end" font-size="14" fill="#9b958a" font-weight="600">0</text>
          <text x="312" y="305" text-anchor="middle" font-size="14" fill="#9b958a" font-weight="700" transform="rotate(-90 312 305)">column voltage</text>
        </g>

        <!-- ============ STEP 0 — one stone vs empty ============ -->
        <g class="rstep rstep0" data-step="0">
          <!-- 1/3 reference gridline -->
          <line x1="360" y1="375" x2="1230" y2="375" stroke="#D2D2D7" stroke-width="1.5" stroke-dasharray="4 6"/>
          <text x="345" y="380" text-anchor="end" font-size="13.5" fill="#86868B" font-weight="700">≈ ⅓</text>
          <!-- empty bar -->
          <rect x="412" y="493" width="116" height="12" rx="5" fill="#C7C7CC"/>
          <text x="470" y="482" text-anchor="middle" font-size="18" font-weight="800" fill="#86868B">≈3%</text>
          <text x="470" y="535" text-anchor="middle" font-size="16.5" font-weight="700" fill="#6E6E73">empty cell</text>
          <!-- one-stone bar -->
          <rect x="602" y="375" width="116" height="130" rx="8" fill="url(#barGreen)"/>
          <text x="660" y="363" text-anchor="middle" font-size="20" font-weight="800" fill="#2BA84A">33%</text>
          <text x="660" y="535" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1D1D1F">1 stone</text>
        </g>

        <!-- ============ STEP 1 — neighbours bleed it down ============ -->
        <g class="rstep rstep1" data-step="1">
          <!-- two-stone bar -->
          <rect x="792" y="426" width="116" height="79" rx="8" fill="url(#barGreen)"/>
          <text x="850" y="414" text-anchor="middle" font-size="20" font-weight="800" fill="#2BA84A">20%</text>
          <text x="850" y="532" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1D1D1F">2 stones</text>
          <text x="850" y="552" text-anchor="middle" font-size="13.5" font-weight="600" fill="#86868B">same column</text>
          <!-- three-stone bar -->
          <rect x="982" y="442" width="116" height="63" rx="8" fill="url(#barGreen)"/>
          <text x="1040" y="430" text-anchor="middle" font-size="20" font-weight="800" fill="#2BA84A">16%</text>
          <text x="1040" y="532" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1D1D1F">3 stones</text>
          <text x="1040" y="552" text-anchor="middle" font-size="13.5" font-weight="600" fill="#86868B">same column</text>
          <!-- only-down annotation -->
          <path d="M 700 360 Q 855 372 1035 428" fill="none" stroke="#E89318" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#rDown)"/>
          <text x="858" y="318" text-anchor="middle" font-size="17" font-weight="800" fill="#A65E00">each neighbour drags it DOWN</text>
          <text x="858" y="340" text-anchor="middle" font-size="15" font-weight="600" fill="#A65E00">— only ever down, never up</text>
        </g>

        <!-- ============ STEP 2 — the trigger line ============ -->
        <g class="rstep rstep2" data-step="2">
          <!-- detected / ignored zone divider -->
          <line x1="360" y1="466" x2="1150" y2="466" stroke="#E74C3C" stroke-width="3" stroke-dasharray="10 7"/>
          <rect x="1150" y="448" width="118" height="36" rx="9" fill="#E74C3C"/>
          <text x="1209" y="472" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">TRIGGER 10%</text>
          <!-- verdict ticks -->
          <text x="660" y="395" text-anchor="middle" font-size="22" font-weight="800" fill="#1B7A3D">✓</text>
          <text x="850" y="446" text-anchor="middle" font-size="22" font-weight="800" fill="#1B7A3D">✓</text>
          <text x="1040" y="462" text-anchor="middle" font-size="22" font-weight="800" fill="#1B7A3D">✓</text>
          <!-- zone labels at far right -->
          <text x="1209" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#2BA84A">↑ detected</text>
          <text x="1209" y="502" text-anchor="middle" font-size="15" font-weight="700" fill="#9b958a">↓ ignored</text>
          <!-- worst-case note -->
          <text x="660" y="155" text-anchor="middle" font-size="17.5" font-weight="800" fill="#1D1D1F">We only need YES / NO — not pressure.</text>
          <text x="660" y="180" text-anchor="middle" font-size="15.5" font-weight="600" fill="#6E6E73">Worst real press (16%) still clears the line; an empty cell never reaches it.</text>
          <!-- decision chip -->
          <g transform="translate(986 120)">
            <rect x="0" y="0" width="240" height="50" rx="12" fill="#FAF6EE" stroke="#E89318" stroke-width="2"/>
            <text x="120" y="32" text-anchor="middle" font-size="17" font-weight="800" fill="#A65E00">R_ref = 200 Ω · binary</text>
          </g>
        </g>

      </svg>
    </div>

    <div class="step-progress">
      <span data-dot></span>
      <span data-dot></span>
      <span data-dot></span>
    </div>
  </div>
</section>
