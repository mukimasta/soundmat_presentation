<section class="slide bento s-sensor-bento" id="slide-7">
  <div class="slide-header">
    <div>
      <div class="slide-eyebrow">SENSOR DESIGN</div>
      <h2 class="slide-title">224 zones on a polar grid</h2>
    </div>
    <div class="slide-index">07</div>
  </div>
  <div class="bento-grid sensor-spec-stage">

    <div class="bento-card c-hero cream">
      <div class="sensor-polar-panel">
        <div class="card-label">Polar geometry</div>
        <div class="sensor-polar-stage">
          <div class="sensor-polar-wrap">
            <svg class="diagram sensor-polar-svg" viewBox="-200 -200 400 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <radialGradient id="sensorMat" cx="0" cy="0" r="180" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#FFFAF0"/>
                  <stop offset="72%" stop-color="#F7F2E8"/>
                  <stop offset="100%" stop-color="#F0EBE0"/>
                </radialGradient>
              </defs>
              <circle cx="0" cy="0" r="180" fill="url(#sensorMat)" stroke="#1D1D1F" stroke-width="1.2" opacity="0.18"/>
              <g stroke="#1D1D1F" stroke-width="0.9" fill="none" opacity="0.5">
                <circle cx="0" cy="0" r="22"/><circle cx="0" cy="0" r="44"/><circle cx="0" cy="0" r="66"/><circle cx="0" cy="0" r="88"/>
                <circle cx="0" cy="0" r="110"/><circle cx="0" cy="0" r="132"/><circle cx="0" cy="0" r="154"/><circle cx="0" cy="0" r="176"/>
              </g>
              <g id="sliceLines32" stroke="#1D1D1F" stroke-width="0.45" opacity="0.36"></g>
              <g id="sliceLines16" stroke="#1D1D1F" stroke-width="0.45" opacity="0.3"></g>
              <!-- Example zones: inner 2 rings = 16 slices (22.5°); outer rings = 32 slices (11.25°) -->
              <g fill="#E89318" opacity="0.9">
                <path d="M 22,0 L 44,0 A 44,44 0 0,1 40.65,16.84 L 20.33,8.42 A 22,22 0 0,0 22,0 Z"/>
                <path d="M 88,0 L 110,0 A 110,110 0 0,1 107.89,21.46 L 86.31,17.17 A 88,88 0 0,0 88,0 Z" transform="rotate(45)"/>
              </g>
              <circle cx="0" cy="0" r="4" fill="#1D1D1F"/>
            </svg>
          </div>
          <p class="sensor-polar-cap">8 rings &middot; 32 slices (16 in the inner 2 rings)</p>
        </div>
      </div>
    </div>

    <div class="bento-card c-spec accent">
      <div class="sensor-spec-panel">
        <div class="sensor-224-block">
          <div class="card-big-num sensor-224-num" data-countup="224">224</div>
          <p class="sensor-224-label">sensing zones</p>
        </div>
        <div class="sensor-map-cards">
          <div class="sensor-map-card">
            <span class="sensor-map-num">8</span>
            <div class="sensor-map-copy">
              <span class="sensor-map-title">rings</span>
              <span class="sensor-map-arrow" aria-hidden="true">&rarr;</span>
              <span class="sensor-map-desc">8 music layers</span>
            </div>
          </div>
          <div class="sensor-map-card">
            <span class="sensor-map-num">32</span>
            <div class="sensor-map-copy">
              <span class="sensor-map-title">slices</span>
              <span class="sensor-map-arrow" aria-hidden="true">&rarr;</span>
              <span class="sensor-map-desc">32 beats per loop</span>
            </div>
          </div>
        </div>
        <p class="sensor-map-note sensor-map-note--emph">Inner 2 rings use 16 slices so the center does not crowd.</p>
      </div>
    </div>

  </div>
</section>
