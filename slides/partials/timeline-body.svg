        <defs>
          <linearGradient id="tlAxis" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ECECEE"/>
            <stop offset="100%" stop-color="#D2D2D7"/>
          </linearGradient>
          <linearGradient id="tlBar" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#F5A623"/>
            <stop offset="100%" stop-color="#E89318"/>
          </linearGradient>
          <linearGradient id="tlBarSoft" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FFD89A"/>
            <stop offset="100%" stop-color="#F5A623"/>
          </linearGradient>
          <linearGradient id="tlBarDark" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#3A3A3D"/>
            <stop offset="100%" stop-color="#1D1D1F"/>
          </linearGradient>
        </defs>

        <style>
          .tl-label  { font: 700 22px system-ui, -apple-system, sans-serif; fill: #1D1D1F; }
          .tl-month  { font: 700 20px system-ui, -apple-system, sans-serif; fill: #86868B; letter-spacing: 0.1em; }
          .tl-axis   { font: 600 18px system-ui, -apple-system, sans-serif; fill: #6E6E73; }
          .tl-range  { font: 600 20px system-ui, -apple-system, sans-serif; fill: #1D1D1F; }
          .tl-range-sub { font: 500 17px system-ui, -apple-system, sans-serif; fill: #6E6E73; }
        </style>

        <text class="tl-month" x="380" y="36" text-anchor="middle">APRIL</text>
