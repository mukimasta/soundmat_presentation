        <text class="tl-month" x="1180" y="36" text-anchor="middle">JUNE</text>
        <g stroke="#E8E8ED" stroke-width="2">
          <line x1="380" y1="44" x2="380" y2="500"/>
          <line x1="780" y1="44" x2="780" y2="500"/>
          <line x1="1180" y1="44" x2="1180" y2="500"/>
        </g>

        <line x1="220" y1="56" x2="1280" y2="56" stroke="url(#tlAxis)" stroke-width="6" stroke-linecap="round"/>
        <text class="tl-axis" x="220" y="78">Apr 1</text>
        <text class="tl-axis" x="1280" y="78" text-anchor="end">Jun 10</text>

        <!-- x = 220 + day/70 * 1060 (day 0 = Apr 1) -->

        <g class="tl-lane" style="animation-delay:120ms">
