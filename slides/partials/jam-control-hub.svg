<svg class="diagram" viewBox="0 0 380 218" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="hubFeltA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="70%" stop-color="#F8F4EB"/>
      <stop offset="100%" stop-color="#EFEADF"/>
    </radialGradient>
    <radialGradient id="hubGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============ MAT A · stones in center → playing ============ -->
  <g>
    <circle cx="82" cy="92" r="74" fill="url(#hubFeltA)" stroke="#E2DCCF" stroke-width="1.5"/>
    <g fill="none" stroke="#D6CFC0" stroke-width="1" opacity="0.8">
      <circle cx="82" cy="92" r="60"/><circle cx="82" cy="92" r="45"/>
    </g>
    <!-- scan sweep = it's running -->
    <path d="M82 92 L82 26 A66 66 0 0 1 139.2 59 Z" fill="url(#hubGlow)"/>
    <!-- hub R0·R1 highlighted -->
    <circle cx="82" cy="92" r="42" fill="url(#hubGlow)"/>
    <circle cx="82" cy="92" r="32" fill="#FFFFFF" stroke="#F5A623" stroke-width="3"/>
    <circle cx="82" cy="92" r="19" fill="none" stroke="#F5A623" stroke-width="1.4" opacity="0.5"/>
    <!-- stones -->
    <ellipse cx="75" cy="88" rx="9" ry="6" fill="#6E5640"/>
    <ellipse cx="89" cy="96" rx="11" ry="7" fill="#4A3826"/>
    <ellipse cx="83" cy="81" rx="6.5" ry="4" fill="#8A6E50"/>
    <!-- state badge -->
    <g transform="translate(82 198)">
      <rect x="-52" y="-15" width="104" height="30" rx="15" fill="#2D7A2D" fill-opacity="0.12" stroke="#2D7A2D" stroke-opacity="0.5"/>
      <path d="M-28 -6 L-28 6 L-18 0 Z" fill="#1B5E20"/>
      <text x="7" y="5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#1B5E20">Playing</text>
    </g>
  </g>

  <!-- toggle between the two states -->
  <g font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#A8A091">
    <text x="190" y="62" text-anchor="middle">place</text>
    <g stroke="#C2BBAD" stroke-width="2" stroke-linecap="round">
      <line x1="216" y1="74" x2="164" y2="74"/>
    </g>
    <path d="M164 74 l9 -4.5 v9 z" fill="#C2BBAD"/>

    <path d="M216 110 l-9 -4.5 v9 z" fill="#C2BBAD"/>
    <g stroke="#C2BBAD" stroke-width="2" stroke-linecap="round">
      <line x1="164" y1="110" x2="216" y2="110"/>
    </g>
    <text x="190" y="130" text-anchor="middle">clear</text>
  </g>

  <!-- ============ MAT B · center empty → stopped ============ -->
  <g>
    <circle cx="298" cy="92" r="74" fill="#F4F2ED" stroke="#E2DCCF" stroke-width="1.5"/>
    <g fill="none" stroke="#D6CFC0" stroke-width="1" opacity="0.6">
      <circle cx="298" cy="92" r="60"/><circle cx="298" cy="92" r="45"/>
    </g>
    <!-- hub empty -->
    <circle cx="298" cy="92" r="32" fill="#FAF8F3" stroke="#C9C2B4" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="298" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#A8A091">R0&middot;R1</text>
    <!-- state badge -->
    <g transform="translate(298 198)">
      <rect x="-52" y="-15" width="104" height="30" rx="15" fill="#EEEBE5" stroke="#C9C2B4"/>
      <rect x="-28" y="-5" width="10" height="10" rx="1.5" fill="#86868B"/>
      <text x="7" y="5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#6E6E73">Stopped</text>
    </g>
  </g>
</svg>
