<svg class="diagram" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
  <g font-family="system-ui,-apple-system,'SF Pro Display',sans-serif">
