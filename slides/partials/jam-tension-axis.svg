<svg class="diagram jam-tension-svg" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="none">
  <defs>
    <linearGradient id="jamTensionGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B7A57" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#C8C4BC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E89318" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <g font-family="system-ui,-apple-system,'SF Pro Display',sans-serif">
    <text x="80" y="56" font-size="28" font-weight="800" fill="#1D1D1F">Always sounds good</text>
    <text x="1120" y="56" text-anchor="end" font-size="28" font-weight="800" fill="#E89318">Feels like I did it</text>
    <text x="80" y="88" font-size="17" font-weight="500" fill="#86868B">Safe, immersive — low control</text>
    <text x="1120" y="88" text-anchor="end" font-size="17" font-weight="500" fill="#A65E00">Feedback, timing, participation</text>

    <rect x="80" y="118" width="1040" height="22" rx="11" fill="#E8E6E1"/>
    <rect x="80" y="118" width="1040" height="22" rx="11" fill="url(#jamTensionGrad)"/>
    <circle cx="280" cy="129" r="14" fill="#3B7A57" stroke="#fff" stroke-width="3"/>
    <circle cx="880" cy="129" r="14" fill="#E89318" stroke="#fff" stroke-width="3"/>

    <rect x="80" y="168" width="480" height="200" rx="24" fill="#FAF6EE" stroke="#3B7A57" stroke-width="2"/>
    <text x="120" y="212" font-size="14" font-weight="800" fill="#3B7A57" letter-spacing="0.1em">AMBIENT</text>
    <text x="120" y="252" font-size="26" font-weight="800" fill="#1D1D1F">Narrative soundscape</text>
    <text x="120" y="288" font-size="17" font-weight="500" fill="#6E6E73">Kyoto &middot; sound pool</text>
    <text x="120" y="328" font-size="15" font-weight="600" fill="#3B7A57">Heard or ignored</text>

    <rect x="640" y="168" width="480" height="200" rx="24" fill="#1D1D1F" stroke="#E89318" stroke-width="2.2"/>
    <text x="680" y="212" font-size="14" font-weight="800" fill="#F5A623" letter-spacing="0.1em">JAM</text>
    <text x="680" y="252" font-size="26" font-weight="800" fill="#fff">Lo-Fi loop you build</text>
    <text x="680" y="288" font-size="17" font-weight="500" fill="rgba(255,255,255,0.62)">Rotating scan &middot; always in key</text>
    <text x="680" y="328" font-size="15" font-weight="600" fill="#F5A623">Multiplayer, expressive</text>

    <text x="600" y="400" text-anchor="middle" font-size="18" font-weight="600" fill="#6E6E73">We built two modes — not one compromise</text>
  </g>
</svg>
