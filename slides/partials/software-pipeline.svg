    <text x="496" y="108" text-anchor="middle" font-size="13" font-weight="800" fill="#F5A623">SuperCollider</text>
    <text x="496" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="rgba(255,255,255,0.65)">makes it audible</text>
    <text x="496" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="rgba(255,255,255,0.65)">marimba, pads, drums</text>

