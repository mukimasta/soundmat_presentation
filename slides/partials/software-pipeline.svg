      <path d="M0,0 L10,5 L0,10 z" fill="#34C759"/>
    </marker>
    <marker id="swPipeArrGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFD60A"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'SF Pro Display',sans-serif">
    <rect x="24" y="88" width="100" height="88" rx="16" fill="#1D1D1F"/>
