    <text x="74" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#9AE6B4">pressure up</text>

    <path d="M 124 132 L 168 132" stroke="#34C759" stroke-width="3.5" marker-end="url(#swPipeArrGreen)"/>

    <rect x="168" y="56" width="200" height="152" rx="20" fill="#FAF6EE" stroke="#E89318" stroke-width="1.6"/>
    <text x="268" y="92" text-anchor="middle" font-size="14" font-weight="800" fill="#E89318">PI SOFTWARE</text>
    <text x="268" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">read the mat</text>
    <text x="268" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">choose the music</text>
    <text x="268" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">set LED colours</text>

