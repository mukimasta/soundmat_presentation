<svg class="diagram" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="fwLinkEndGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34C759"/>
    </marker>
    <marker id="fwLinkEndGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFD60A"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'SF Pro Display',sans-serif">
    <!-- Pi -->
    <rect x="16" y="36" width="310" height="300" rx="28" fill="#FAF6EE" stroke="#E89318" stroke-width="2"/>
    <rect x="48" y="88" width="246" height="128" rx="18" fill="#fff" stroke="#E89318" stroke-width="1.4"/>
    <circle cx="171" cy="152" r="22" fill="#34C759"/>
    <text x="171" y="262" text-anchor="middle" font-size="28" font-weight="800" fill="#1D1D1F">Raspberry Pi</text>
    <text x="171" y="296" text-anchor="middle" font-size="18" font-weight="600" fill="#6E6E73">sonification</text>

    <!-- ESP32 / SoundMat -->
    <rect x="574" y="36" width="310" height="300" rx="28" fill="#1D1D1F"/>
    <rect x="606" y="88" width="246" height="128" rx="18" fill="#2C2C2E"/>
    <text x="729" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#86868B">ESP32</text>
    <text x="729" y="262" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">Inside SoundMat</text>
    <text x="729" y="296" text-anchor="middle" font-size="18" font-weight="600" fill="rgba(255,255,255,0.62)">sensor + LEDs</text>

    <!-- S-frame: ESP32 → Pi -->
    <path d="M 574 148 L 326 148" stroke="#34C759" stroke-width="5" fill="none" marker-end="url(#fwLinkEndGreen)"/>
    <text x="450" y="124" text-anchor="middle" font-size="15" font-weight="800" fill="#248A3D">S-frame · sensor → Pi</text>

    <!-- L-frame: Pi → ESP32 -->
    <path d="M 326 324 L 574 324" stroke="#FFD60A" stroke-width="5" fill="none" marker-end="url(#fwLinkEndGold)"/>
    <text x="450" y="352" text-anchor="middle" font-size="15" font-weight="800" fill="#9A7B00">L-frame · LEDs → mat</text>

    <!-- UART -->
    <rect x="384" y="218" width="132" height="52" rx="26" fill="#1D1D1F" stroke="#86868B" stroke-width="1"/>
    <text x="450" y="252" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">UART</text>
  </g>
</svg>
